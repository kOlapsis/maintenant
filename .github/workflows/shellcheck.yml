name: ShellCheck

on:
  pull_request:
    paths:
      - "deploy/install/**"
  push:
    paths:
      - "deploy/install/**"

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck deploy/install/*.sh
