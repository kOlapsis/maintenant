# Publishes a verifiable release when a GitHub Release is published: standalone
# Linux binaries for the native install script, and the container image.
#
# Security model:
# - The image is built by the same reusable workflow the CI uses (build-docker.yml),
#   so a release ships exactly what the pipeline validated — no parallel build path
#   with its own, unreviewed steps. That build restores no cache (cache-poisoning
#   hardening) and its digest is the subject of every attestation below.
# - Privilege separation: the jobs that run project code (build, build-binaries)
#   hold only contents:read (+ packages:write for the image); the jobs that attest,
#   sign and upload run no project code.
# - Keyless signing over OIDC (id-token: write): no long-lived signing key exists
#   to be stolen, and the certificate binds the signature to this workflow file.
#   deploy/install/install.sh pins that identity, so renaming this file or moving
#   the jobs breaks every native install until the script is updated too.
# - Artifacts are independently verifiable: SLSA build provenance on both the
#   binaries and the image, a CycloneDX SBOM attested in the registry, a Cosign
#   signature on the image and on SHA256SUMS. See SECURITY.md for the commands.
#
# Note that release events set github.ref to the tag, so docker/metadata-action
# computes the semver tags and `latest` exactly as it did on the old tag trigger.
name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Standalone binaries for `curl … | sudo bash` installs. CGO is on (go-sqlite3),
  # so each architecture builds on its own native runner rather than cross-compiling.
  build-binaries:
    name: Build binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache is restored on a release build: a poisoned cache entry would
      # end up inside the binary users install (cache-poisoning hardening,
      # same rule as build-docker.yml).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # No `cache:` input is given, so setup-node restores nothing; the audit
      # flags the action itself, hence the ignore.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "22"

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The public key is a build-time constant, not a secret to protect at
      # runtime, but it goes through env so it never lands in the shell command
      # line (and so the workflow stays free of template injection).
      - name: Build the binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.event.release.tag_name }}
          COMMIT: ${{ github.sha }}
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
        run: |
          if [ -z "${LICENSE_PUBLIC_KEY}" ]; then
            echo "::error::LICENSE_PUBLIC_KEY secret is not set."
            exit 1
          fi
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -ldflags "-s -w \
              -X main.version=${VERSION} \
              -X main.commit=${COMMIT} \
              -X main.buildDate=${build_date} \
              -X main.publicKeyB64=${LICENSE_PUBLIC_KEY}" \
            -o "maintenant-${VERSION}-linux-${GOARCH}" \
            ./cmd/maintenant

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.arch }}
          path: maintenant-*-linux-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  # Runs no project code: it checksums, attests, signs and uploads what
  # build-binaries produced. SHA256SUMS covers every architecture at once, so a
  # single signature protects the whole set.
  publish-binaries:
    name: Attest, sign and publish the binaries
    needs: build-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum maintenant-* > SHA256SUMS

      - name: SLSA build provenance attestation (binaries)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/maintenant-*

      # cosign-installer v4 installs Cosign 3.x: a local cosign 2.x would wrongly
      # answer "no signatures found" when verifying.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # .sig + .pem are what install.sh fetches; the bundle is the modern format
      # for anyone verifying by hand.
      - name: Sign SHA256SUMS (keyless Sigstore)
        working-directory: release-assets
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            --bundle SHA256SUMS.bundle \
            SHA256SUMS

      - name: Upload the assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        working-directory: release-assets
        run: |
          gh release upload "$TAG" \
            maintenant-*-linux-* \
            SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem SHA256SUMS.bundle \
            --clobber

  # Installs from the release that was just published, through the documented
  # entry point, so a broken asset name or checksum fails here and not on a
  # user's machine.
  install-smoke:
    name: Smoke install (${{ matrix.arch }})
    needs: publish-binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run the install script
        env:
          MAINTENANT_VERSION: ${{ github.event.release.tag_name }}
        run: sudo -E sh deploy/install/install.sh --no-service

      - name: Verify the installed binary
        run: maintenant --version

  # Reuses the existing multi-arch build chain: the image published by a release
  # is exactly the one the CI produces, with no parallel build path.
  build:
    name: Build and publish the image
    uses: ./.github/workflows/build-docker.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true

  provenance:
    name: Provenance (SLSA + SBOM + Cosign)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Attach provenance.intoto.jsonl to the release (Scorecard Signed-Releases).
      contents: write
      # Push the attestations next to the image in GHCR.
      packages: write
      # OIDC: keyless Sigstore signing and native attestations.
      id-token: write
      attestations: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SLSA build provenance attestation (native)
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      # SBOM produced by Trivy rather than anchore/sbom-action: the latter
      # downloads and runs install.sh from a mutable branch
      # (raw.githubusercontent.com/.../main/install.sh), which pinning the action
      # by SHA does not cover (plumber ISSUE-714).
      - name: Generate the SBOM (Trivy, CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      # cosign-installer v4 installs Cosign 3.x: a local cosign 2.x would wrongly
      # answer "no signatures found" when verifying.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless Sigstore)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Scorecard Signed-Releases looks for a *.intoto.jsonl asset on the release,
      # not the OCI attestation pushed to the registry: two distinct artifacts.
      - name: Attach the provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl sbom.cdx.json --clobber
