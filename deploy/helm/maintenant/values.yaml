## Maintenant Helm Chart — default values

image:
  repository: ghcr.io/kolapsis/maintenant
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

## Runtime: "kubernetes" or "docker"
runtime: kubernetes

## License key (Pro edition)
license:
  key: ""
  ## Use an existing secret instead of the inline key above.
  ## The secret must have a key named "license-key".
  existingSecret: ""

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  ## Migrations that rebuild a table copy it before dropping the original, and
  ## SQLite temp files are written here too (SQLITE_TMPDIR=/data). Allow several
  ## times the expected database size or an upgrade can run the volume out of space.
  size: 10Gi
  ## Use an existing PVC (persistence.enabled is ignored when set)
  existingClaim: ""

## Schema migrations run before the HTTP listener starts, so /health does not
## answer while they work — minutes on a large database. The startup probe holds
## the liveness probe off for periodSeconds x failureThreshold (10 min by
## default); raise failureThreshold if an upgrade needs longer.
startupProbe:
  periodSeconds: 10
  failureThreshold: 60

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: maintenant.example.com
  tls: []
  #  - secretName: maintenant-tls
  #    hosts:
  #      - maintenant.example.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

## Extra environment variables injected into the container
extraEnv: []
# - name: MAINTENANT_WEBHOOK_URL
#   value: "https://hooks.example.com/..."

serviceAccount:
  ## Set to false to bring your own ServiceAccount
  create: true
  name: ""
  annotations: {}

## ClusterRole & ClusterRoleBinding are always created when serviceAccount.create=true
rbac:
  create: true

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}