{{- if .Values.rbac.create }}
{{- if and (not .Values.serviceAccount.create) (not .Values.serviceAccount.name) }}
{{- fail "rbac.create=true with serviceAccount.create=false needs serviceAccount.name: the chart will not grant cluster-wide read access to the namespace's default ServiceAccount. Set serviceAccount.name to your ServiceAccount, or rbac.create=false to manage the permissions yourself." }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "maintenant.fullname" . }}
  labels:
    {{- include "maintenant.labels" . | nindent 4 }}
rules:
  # Read-only, exactly the APIs the runtime calls (internal/kubernetes/rbac.go).
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # Requires metrics-server.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "maintenant.fullname" . }}
  labels:
    {{- include "maintenant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "maintenant.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "maintenant.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}