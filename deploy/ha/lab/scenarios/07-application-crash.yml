---
# Scenario 7 of the bench plan, Application crash.
#
# The numbers 1 to 12 belong to the plan permanently and are never reused, not
# even in a mode where the scenario has no object (FR-047). `expected` is filled
# in by the phase that implements the mode; a scenario whose expectation is
# still empty is reported as such, never as passed.
id: 7
slug: application-crash
name: Application crash
source: bench plan
repetitions: 1
injection:
  'on': active
  command: pkill -9 -x maintenant
repair:
  'on': host
  command: 'echo "no repair: the bounded local restart is what is under test"'
verify:
  'on': measurement
  command: curl -fsS -m 5 "http://$LAB_SERVICE_ADDRESS:8080/api/v1/health" >/dev/null
measures:
- rto_ms
- alerts_induced
- local_restarts
modes:
  ip-only:
    applicable: true
    max_rto_s: 30
    expected: Bounded local restart of the application on the same node, before any failover, in under 30 s (SC-005).
  postgres/streaming:
    applicable: true
    expected: Bounded local restart on the same node, before any failover. Service restored
      in under 30 s, with no failover (SC-005). The number of local restarts is an explicit
      setting, recorded in the run report.
  sqlite/drbd:
    applicable: true
    expected: Bounded local restart on the same node, before any failover. Service restored
      in under 30 s, with no failover (SC-005). The number of local restarts is an explicit
      setting, recorded in the run report.
  postgres/drbd:
    applicable: true
    expected: Bounded local restart on the same node, before any failover. Service restored
      in under 30 s, with no failover (SC-005). The number of local restarts is an explicit
      setting, recorded in the run report.
