---
# Scenario 4 of the bench plan, Freeze of the cluster agent, without a crash.
#
# The numbers 1 to 12 belong to the plan permanently and are never reused, not
# even in a mode where the scenario has no object (FR-047). `expected` is filled
# in by the phase that implements the mode; a scenario whose expectation is
# still empty is reported as such, never as passed.
id: 4
slug: cluster-agent-freeze
name: Freeze of the cluster agent, without a crash
source: bench plan
repetitions: 1
injection:
  'on': active
  command: pkill -STOP -x om || systemctl kill -s SIGSTOP opensvc-server.service
repair:
  'on': host
  command: virsh domstate "$LAB_ACTIVE_DOMAIN" | grep -q "shut off" && virsh start "$LAB_ACTIVE_DOMAIN"
    || $LAB_SSH_ACTIVE "sudo -n pkill -CONT -x om"
verify:
  'on': measurement
  command: curl -fsS -m 5 "http://$LAB_SERVICE_ADDRESS:8080/api/v1/health" >/dev/null
measures:
- rto_ms
- nodes_written
- alerts_induced
- fencing_outcome
modes:
  ip-only:
    applicable: true
    expected: 'Heartbeat expiry detects the freeze. Detection alone is not recovery: a frozen
      daemon does not kill itself, and the survivor cannot take the service while the peer
      still holds it. The frozen node is fenced before anything starts anywhere else. If the
      fencing fails, nothing starts elsewhere and the operator is alerted: a failed fencing
      blocks, it never lets through (FR-024). Data is local to each node in this mode, so
      writes are not compared.'
  postgres/streaming:
    applicable: true
    expected: 'Heartbeat expiry detects the freeze. Detection alone is not recovery: a frozen
      daemon does not kill itself, and the survivor cannot take the data while the peer still
      holds it. The frozen node is fenced before anything starts anywhere else. If the fencing
      fails, nothing starts elsewhere and the operator is alerted: a failed fencing blocks,
      it never lets through (FR-024).'
  sqlite/drbd:
    applicable: true
    expected: 'Heartbeat expiry detects the freeze. Detection alone is not recovery: a frozen
      daemon does not kill itself, and the survivor cannot take the data while the peer still
      holds it. The frozen node is fenced before anything starts anywhere else. If the fencing
      fails, nothing starts elsewhere and the operator is alerted: a failed fencing blocks,
      it never lets through (FR-024).'
  postgres/drbd:
    applicable: true
    expected: 'Heartbeat expiry detects the freeze. Detection alone is not recovery: a frozen
      daemon does not kill itself, and the survivor cannot take the data while the peer still
      holds it. The frozen node is fenced before anything starts anywhere else. If the fencing
      fails, nothing starts elsewhere and the operator is alerted: a failed fencing blocks,
      it never lets through (FR-024).'
