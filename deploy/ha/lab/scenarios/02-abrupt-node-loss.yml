---
# Scenario 2 of the bench plan, Abrupt loss of the active node.
#
# The numbers 1 to 12 belong to the plan permanently and are never reused, not
# even in a mode where the scenario has no object (FR-047). `expected` is filled
# in by the phase that implements the mode; a scenario whose expectation is
# still empty is reported as such, never as passed.
id: 2
slug: abrupt-node-loss
name: Abrupt loss of the active node
source: bench plan
repetitions: 20
injection:
  'on': host
  command: virsh destroy "$LAB_ACTIVE_DOMAIN"
repair:
  'on': host
  command: virsh start "$LAB_ACTIVE_DOMAIN"
verify:
  'on': measurement
  command: curl -fsS -m 5 "http://$LAB_SERVICE_ADDRESS:8080/api/v1/health" >/dev/null
measures:
- rto_ms
- writes
- telemetry_gap_s
- telemetry_samples_lost
- alerts_induced
- agents
- nodes_written
- inventory
- primary_count
- former_primary_rebuild
modes:
  ip-only:
    applicable: true
    max_rto_s: 60
    expected: 'Automatic failover with no human action: the survivor fences the destroyed node, takes the service address and starts the application. The availability probe measures the outage. Data is local to each node in this mode, so writes are not compared.'
  postgres/streaming:
    applicable: true
    max_rto_s: 60
    expected: 'Automatic failover with no human action. The survivor fences the destroyed
      node, then app#pg promotes its standby, only once no other primary answers and only if
      that standby had caught up since it was built. Before promoting, it switches to
      asynchronous replication and logs event=sync_dropped loss_window=open reason=promotion,
      whatever postgres_ha_standby_missing says, so no commit waits for the destroyed peer;
      app#0 starts after it. The service answers
      again on the same address in under 60 s, never more than 90 s across all runs (SC-001).
      writes.lost == 0 over at least 20 repetitions (SC-002). Every enrolled agent reconnects
      within 90 s with the same identity, with no re-enrolment and no alert caused by the failover
      alone (SC-007). When the destroyed node boots again, its PostgreSQL unit refuses to start
      as a primary: the node marks itself overtaken and rebuilds as a standby of the survivor,
      pg_rewind first and a full copy if that fails, with no intervention. Once that standby is
      less than a WAL segment behind, the survivor returns to synchronous replication (event=sync_restored
      loss_window=closed); the bench turns green again only then, and the service stays on the
      survivor (SC-011).'
  sqlite/drbd:
    applicable: true
    expected: Automatic failover with no human action. The service answers again on the same
      address in under 60 s, never more than 90 s across all runs (SC-001). writes.lost ==
      0 over at least 20 repetitions (SC-002). Every enrolled agent reconnects within 90 s
      with the same identity, with no re-enrolment and no alert caused by the failover alone
      (SC-007). The volume is promoted on the survivor, the file system is mounted,
      the SQLite journal is recovered, then the application starts.
  postgres/drbd:
    applicable: true
    expected: Automatic failover with no human action. The service answers again on the same
      address in under 60 s, never more than 90 s across all runs (SC-001). writes.lost ==
      0 over at least 20 repetitions (SC-002). Every enrolled agent reconnects within 90 s
      with the same identity, with no re-enrolment and no alert caused by the failover alone
      (SC-007).
note: This is the scenario the whole bench exists for. It is played with repetitions, not
  once.
