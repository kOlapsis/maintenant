---
# Scenario 5 of the bench plan, Inter-site partition.
#
# The numbers 1 to 12 belong to the plan permanently and are never reused, not
# even in a mode where the scenario has no object (FR-047). `expected` is filled
# in by the phase that implements the mode; a scenario whose expectation is
# still empty is reported as such, never as passed.
id: 5
slug: inter-site-partition
name: Inter-site partition
source: bench plan
repetitions: 1
injection:
  'on': active
  command: iptables -A INPUT -s "$LAB_PASSIVE_ADDRESS" -j DROP && iptables -A OUTPUT -d "$LAB_PASSIVE_ADDRESS"
    -j DROP
repair:
  'on': active
  command: iptables -D INPUT -s "$LAB_PASSIVE_ADDRESS" -j DROP; iptables -D OUTPUT -d "$LAB_PASSIVE_ADDRESS"
    -j DROP
verify:
  'on': measurement
  command: curl -fsS -m 5 "http://$LAB_SERVICE_ADDRESS:8080/api/v1/health" >/dev/null
measures:
- nodes_written
- writes
- rto_ms
- divergence
modes:
  ip-only:
    applicable: true
    expected: 'The arbitrator decides. Exactly one side keeps or takes the service; the other
      stands down. nodes_written is never 2. Data is local to each node in this mode, so writes
      are not compared.'
  postgres/streaming:
    applicable: true
    expected: 'The arbitrator decides. Exactly one side keeps or takes the service; the other
      stands down. After repair, verification shows a single side wrote: nodes_written is
      never 2, and no data diverged (SC-004).'
  sqlite/drbd:
    applicable: true
    expected: 'The arbitrator decides. Exactly one side keeps or takes the service; the other
      stands down. After repair, verification shows a single side wrote: nodes_written is
      never 2, and no data diverged (SC-004).'
  postgres/drbd:
    applicable: true
    expected: 'The arbitrator decides. Exactly one side keeps or takes the service; the other
      stands down. After repair, verification shows a single side wrote: nodes_written is
      never 2, and no data diverged (SC-004).'
