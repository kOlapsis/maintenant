---
# Scenario 5 of the bench plan, Inter-site partition.
#
# The numbers 1 to 12 belong to the plan permanently and are never reused, not
# even in a mode where the scenario has no object (FR-047). `expected` is filled
# in by the phase that implements the mode; a scenario whose expectation is
# still empty is reported as such, never as passed.
id: 5
slug: inter-site-partition
name: Inter-site partition
source: bench plan
repetitions: 1
injection:
  'on': active
  command: iptables -A INPUT -s "$LAB_PASSIVE_ADDRESS" -j DROP && iptables -A OUTPUT -d "$LAB_PASSIVE_ADDRESS"
    -j DROP
repair:
  'on': host
  command: |
    $LAB_SSH_ACTIVE "sudo -n iptables -D INPUT -s $LAB_PASSIVE_ADDRESS -j DROP; sudo -n iptables -D OUTPUT -d $LAB_PASSIVE_ADDRESS -j DROP" 2>/dev/null
    for d in "$LAB_ACTIVE_DOMAIN" "$LAB_PASSIVE_DOMAIN"; do
      virsh list --name | grep -qx "$d" || virsh start "$d" || exit 1
    done
settle_s: 60
verify:
  'on': host
  command: |
    holders=0
    for s in "$LAB_SSH_ACTIVE" "$LAB_SSH_PASSIVE"; do
      $s ip -o addr show 2>/dev/null | grep -q " inet $LAB_SERVICE_ADDRESS/" && holders=$((holders + 1))
    done
    [ "$holders" -eq 1 ] && curl -fsS -m 5 "http://$LAB_SERVICE_ADDRESS:8080/api/v1/health" >/dev/null
measures:
- failover_count
- nodes_written
- writes
- rto_ms
- divergence
modes:
  ip-only:
    applicable: true
    expected: 'The heartbeats keep flowing through the relay on the third machine, so om3 sees
      no split: no vote is asked, no node reboots, nothing is fenced and the service stays on
      the active node. nodes_written is never 2. Data is local to each node in this mode, so
      writes are not compared.'
  postgres/streaming:
    applicable: true
    expected: 'The heartbeats keep flowing through the relay on the third machine, so om3 sees
      no split: no vote is asked, no node reboots, nothing is fenced and the service stays on
      the primary. The standby loses its stream; with postgres_ha_standby_missing=block the
      writes wait until the partition heals and none acknowledged is lost, and the standby catches
      up after repair. nodes_written is never 2, and no data diverged (SC-004).'
  sqlite/drbd:
    applicable: true
    expected: 'The heartbeats keep flowing through the relay on the third machine, so om3 sees
      no split: no vote is asked, no node reboots, nothing is fenced and the service stays on
      the active node. Its DRBD copy keeps quorum through the diskless vote on the third machine
      and keeps taking writes; the passive copy goes Outdated and resyncs after repair. nodes_written
      is never 2, and no data diverged (SC-004).'
  postgres/drbd:
    applicable: true
    expected: 'The heartbeats keep flowing through the relay on the third machine, so om3 sees
      no split: no vote is asked, no node reboots, nothing is fenced and the service stays on
      the active node. Its DRBD copy keeps quorum through the diskless vote on the third machine
      and keeps taking writes; the passive copy goes Outdated and resyncs after repair. nodes_written
      is never 2, and no data diverged (SC-004).'
