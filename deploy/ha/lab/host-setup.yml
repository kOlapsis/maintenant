---
# What the bench needs from the host and cannot do as an ordinary user, done
# once with `lab host-setup`, which runs this play as root on behalf of
# lab_operator: the two image directories, the fencing account and the callout
# it is restricted to. `lab up` and `lab down` then run without root.

- name: Set up the libvirt host for the HA bench
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  tasks:
    - name: Create the image directories of the bench
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ lab_operator }}"
        group: libvirt
        mode: "0711"
      loop:
        - /var/lib/libvirt/images/mnt-lab
        - /var/lib/libvirt/images/mnt-lab-base

    - name: Set up the fencing
      ansible.builtin.include_role:
        name: fencing
        tasks_from: host_setup.yml
