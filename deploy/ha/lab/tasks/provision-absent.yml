---
- name: List the domains libvirt knows
  ansible.builtin.command: "virsh --connect {{ libvirt_uri }} list --all --name"
  register: lab_domains
  changed_when: false

- name: List the running domains
  ansible.builtin.command: "virsh --connect {{ libvirt_uri }} list --name"
  register: lab_running_domains
  changed_when: false

- name: List the networks libvirt knows
  ansible.builtin.command: "virsh --connect {{ libvirt_uri }} net-list --all --name"
  register: lab_nets
  changed_when: false

- name: List the active networks
  ansible.builtin.command: "virsh --connect {{ libvirt_uri }} net-list --name"
  register: lab_active_nets
  changed_when: false

- name: Stop the machines
  ansible.builtin.command: "virsh --connect {{ libvirt_uri }} destroy {{ lab_prefix }}-{{ item.name }}"
  changed_when: true
  when: (lab_prefix ~ '-' ~ item.name) in lab_running_domains.stdout_lines
  loop: "{{ topology.machines }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove the machines from libvirt
  ansible.builtin.command: "virsh --connect {{ libvirt_uri }} undefine {{ lab_prefix }}-{{ item.name }}"
  when: (lab_prefix ~ '-' ~ item.name) in lab_domains.stdout_lines
  changed_when: true
  loop: "{{ topology.machines }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop the networks
  ansible.builtin.command: "virsh --connect {{ libvirt_uri }} net-destroy {{ lab_prefix }}-{{ item.name }}"
  changed_when: true
  when: (lab_prefix ~ '-' ~ item.name) in lab_active_nets.stdout_lines
  loop: "{{ topology.networks }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove the networks from libvirt
  ansible.builtin.command: "virsh --connect {{ libvirt_uri }} net-undefine {{ lab_prefix }}-{{ item.name }}"
  when: (lab_prefix ~ '-' ~ item.name) in lab_nets.stdout_lines
  changed_when: true
  loop: "{{ topology.networks }}"
  loop_control:
    label: "{{ item.name }}"

- name: List the volumes and the seeds
  ansible.builtin.find:
    paths: "{{ lab_work_dir }}"
    file_type: any
    hidden: true
  register: lab_leftovers

- name: Remove the volumes and the seeds
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ lab_leftovers.files }}"
  loop_control:
    label: "{{ item.path }}"
