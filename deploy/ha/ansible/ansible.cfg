# Ansible configuration for the HA bench and the reference production.
# Both are driven from this directory; only the inventory and the fencing
# variable differ between site-lab.yml and site-prod.yml (FR-052).

[defaults]
roles_path = roles
inventory = inventories/lab/hosts.yml
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent
forks = 10
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[privilege_escalation]
become = True
become_method = sudo
become_user = root
