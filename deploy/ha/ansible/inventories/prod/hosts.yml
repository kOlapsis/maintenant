---
# Reference production inventory. Fill in the real hosts.
# Same roles, same scenarios, same measurements as the bench: replaying the
# campaign elsewhere changes this inventory and nothing else (FR-053).
#
# There is no measurement group here: the probes belong to the bench. Add one
# only if the campaign is replayed against these machines.

all:
  vars:
    ha_service_address: "" # service address carried by ip#0
    ha_service_name: "" # DNS name the agents and operators use
    ha_interconnect_network: "" # network carrying the heartbeats

  children:
    opensvc_cluster:
      hosts:
        node-a:
          ansible_host: ""
          ha_site: a
          ha_preferred: true
        node-b:
          ansible_host: ""
          ha_site: b
          ha_preferred: false

    arbitrator:
      hosts:
        arbitrator-1:
          ansible_host: ""
