---
# Bench inventory. Mirrors deploy/ha/lab/topology.yml.
# The roles played against this inventory are the very same ones the production
# inventory uses; only the hosts and the fencing variable change (FR-052, FR-053).

all:
  vars:
    ansible_user: debian
    ha_service_address: 10.10.9.100
    ha_service_http_port: 8080
    ha_service_name: maintenant.lab
    ha_interconnect_network: net-wan

  children:
    opensvc_cluster:
      hosts:
        site-a:
          ansible_host: 10.10.9.11
          ha_site: a
          ha_preferred: true
        site-b:
          ansible_host: 10.10.9.12
          ha_site: b
          ha_preferred: false

    arbitrator:
      hosts:
        arb:
          ansible_host: 10.10.9.13

    # The measurement machine. It carries the two probes; it is never a
    # cluster node and never runs the product.
    measurement:
      hosts:
        probe:
          ansible_host: 10.10.9.14
