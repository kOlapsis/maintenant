---
- name: Remove the nginx site that served the vote before
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/arbitrator
    - /etc/nginx/sites-available/arbitrator
  notify: Reload nginx

- name: Install the client the arbitrator reads PostgreSQL with
  ansible.builtin.apt:
    name: postgresql-client
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: opensvc_arbitrator_backend == 'postgres'

- name: Write the credentials the arbitrator reads PostgreSQL with
  ansible.builtin.copy:
    dest: "{{ opensvc_arbitrator_pgpass }}"
    content: "*:*:*:{{ postgres_ha_arbitrator_user }}:{{ postgres_ha_arbitrator_password }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: opensvc_arbitrator_backend == 'postgres'

- name: Create the directory of the arbitrator
  ansible.builtin.file:
    path: "{{ opensvc_arbitrator_script | dirname }}"
    state: directory
    mode: "0755"

- name: Install the arbitrator
  ansible.builtin.copy:
    src: arbitrator.py
    dest: "{{ opensvc_arbitrator_script }}"
    mode: "0755"
  notify: Restart the arbitrator

- name: Write the nodes the arbitrator recognises
  ansible.builtin.template:
    src: arbitrator.json.j2
    dest: "{{ opensvc_arbitrator_config }}"
    mode: "0644"
  notify: Restart the arbitrator

- name: Write the arbitrator unit
  ansible.builtin.template:
    src: opensvc-arbitrator.service.j2
    dest: /etc/systemd/system/opensvc-arbitrator.service
    mode: "0644"
  notify: Restart the arbitrator

- name: Free the port and apply the new arbitrator
  ansible.builtin.meta: flush_handlers

- name: Start the arbitrator
  ansible.builtin.systemd_service:
    name: opensvc-arbitrator
    enabled: true
    state: started
    daemon_reload: true

- name: Check the arbitrator answers on its own machine
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ opensvc_arbitrator_port }}{{ opensvc_arbitrator_path }}"
    status_code: 200
  retries: 6
  delay: 2
  register: opensvc_arbitrator_local
  until: opensvc_arbitrator_local is succeeded
