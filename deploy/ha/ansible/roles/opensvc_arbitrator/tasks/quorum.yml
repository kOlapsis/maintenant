---
- name: Check this node reaches the arbitrator
  ansible.builtin.uri:
    url: "{{ opensvc_arbitrator_uri | trim }}"
    status_code: 200
  retries: 6
  delay: 5
  register: opensvc_arbitrator_reachable
  until: opensvc_arbitrator_reachable is succeeded

- name: Read the quorum settings the cluster holds
  ansible.builtin.command: "om cluster config get --kw {{ item.key }}"
  register: opensvc_arbitrator_cluster_current
  changed_when: false
  failed_when: false
  loop: "{{ opensvc_arbitrator_cluster_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  run_once: true

- name: Set the quorum settings of the cluster
  ansible.builtin.command: >-
    om cluster config update
    {% for k, v in opensvc_arbitrator_cluster_settings.items() %} --set {{ k }}={{ v }}{% endfor %}
  when: >-
    opensvc_arbitrator_cluster_current.results | map(attribute='stdout') | map('trim') | list
    != opensvc_arbitrator_cluster_settings.values() | map('string') | list
  changed_when: true
  run_once: true

- name: Read the split action this node holds
  ansible.builtin.command: "om node config get --kw {{ item.key }}"
  register: opensvc_arbitrator_node_current
  changed_when: false
  failed_when: false
  loop: "{{ opensvc_arbitrator_node_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Set the split action of this node
  ansible.builtin.command: >-
    om node config update
    {% for k, v in opensvc_arbitrator_node_settings.items() %} --set {{ k }}={{ v }}{% endfor %}
  when: >-
    opensvc_arbitrator_node_current.results | map(attribute='stdout') | map('trim') | list
    != opensvc_arbitrator_node_settings.values() | map('string') | list
  changed_when: true

# om3 accepts cluster.quorum in node.conf, reads it back, and votes without it.
- name: Wait for the daemon to vote with the quorum on and the arbitrator up
  ansible.builtin.command:
    argv: [om, cluster, status, -o, json]
  register: opensvc_arbitrator_live
  changed_when: false
  retries: 12
  delay: 5
  until: >-
    (opensvc_arbitrator_live.stdout | from_json).cluster.config.quorum == opensvc_arbitrator_quorum | bool
    and ((opensvc_arbitrator_live.stdout | from_json).cluster.node[opensvc_arbitrator_nodename].status.arbitrators
         | default({}, true) | dict2items | map(attribute='value')
         | selectattr('url', 'equalto', opensvc_arbitrator_uri | trim)
         | selectattr('status', 'equalto', 'up') | list | length) == 1
    and (opensvc_arbitrator_live.stdout | from_json).cluster.node[opensvc_arbitrator_nodename].config.split_action
        == opensvc_arbitrator_split_action
  vars:
    opensvc_arbitrator_nodename: "{{ ansible_facts['hostname'] }}"
