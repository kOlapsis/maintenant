---
opensvc_service_name: maintenant
opensvc_service_nodename: "{{ ansible_facts['hostname'] }}"
opensvc_service_template: "{{ playbook_dir }}/../opensvc/maintenant-{{ ha_mode | default('ip-only') | replace('/', '-') }}.conf"
opensvc_service_rendered: /etc/maintenant-ha/service.conf

# Installed by the fencing role, which runs in an earlier play.
opensvc_service_fence_guard: /usr/local/sbin/maintenant-fence --guard

# The node address on the network the service address lives on. The bench
# carries both on one network; a deployment that separates them overrides this.
opensvc_service_node_address: "{{ ansible_host | default(inventory_hostname) }}"

# Starting values, recorded with every run; the bench is what fixes them.
opensvc_service_monitor_action: switch
opensvc_service_monitor_schedule: "@10s"
opensvc_service_ip_restart: 2
opensvc_service_ip_restart_delay: 2s
opensvc_service_app_restart: 2
opensvc_service_app_restart_delay: 5s
opensvc_service_pg_restart: 2
opensvc_service_pg_restart_delay: 5s
opensvc_service_pg_start_timeout: 120s
opensvc_service_pg_stop_timeout: 60s

# The binary's standard output and error, which om3 would otherwise discard.
opensvc_service_log_identifier: maintenant

opensvc_service_wait_retries: 36
opensvc_service_wait_delay: 5
