---
# create leaves an orchestrate=ha service frozen, and the daemon never starts a
# frozen service. An unfreeze sent before the daemon has evaluated it is rejected.
- name: Wait for the daemon to see the new service frozen
  ansible.builtin.command:
    argv: [om, cluster, status, -o, json]
  register: opensvc_service_created
  changed_when: false
  retries: 12
  delay: 2
  until: >-
    ((opensvc_service_created.stdout | from_json).cluster.object[opensvc_service_name] | default({})).frozen
    | default('') == 'frozen'
  run_once: true
  listen: Hand the service to the orchestrator

- name: Unfreeze the service
  ansible.builtin.command:
    argv: [om, "{{ opensvc_service_name }}", unfreeze]
  changed_when: true
  run_once: true
  listen: Hand the service to the orchestrator
