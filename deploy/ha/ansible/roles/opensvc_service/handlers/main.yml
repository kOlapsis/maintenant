---
# om3 never starts an instance whose resources are not flagged provisioned; Ansible prepared them.
- name: Flag the resources as provisioned
  ansible.builtin.command:
    argv: [om, "{{ opensvc_service_name }}", instance, provision, --state-only]
  changed_when: true
  run_once: true
  delegate_to: "{{ item }}"
  loop: "{{ ansible_play_hosts }}"
  listen: Hand the service to the orchestrator

# create flags every instance stopped on purpose, and only a start the user asks for lowers that flag.
- name: Start the service
  ansible.builtin.command:
    argv: [om, "{{ opensvc_service_name }}", start, --wait]
  register: opensvc_service_started
  changed_when: true
  failed_when: false
  run_once: true
  listen: Hand the service to the orchestrator
