---
- name: Look for the host callout
  ansible.builtin.stat:
    path: "{{ fencing_host_agent }}"
  register: fencing_host_callout
  delegate_to: localhost
  become: false
  run_once: true

- name: Look for the fencing key
  ansible.builtin.stat:
    path: "{{ fencing_key_dir }}/fencing_ed25519"
  register: fencing_key_file
  delegate_to: localhost
  become: false
  run_once: true

- name: Refuse a host that has not been set up
  ansible.builtin.assert:
    that:
      - fencing_host_callout.stat.exists
      - fencing_key_file.stat.exists
    fail_msg: "the libvirt host is not set up for fencing: run lab/lab host-setup once"

- name: Read the fencing key pair
  ansible.builtin.slurp:
    src: "{{ fencing_key_dir }}/{{ item }}"
  register: fencing_key_material
  delegate_to: localhost
  become: false
  run_once: true
  loop: [fencing_ed25519, fencing_ed25519.pub]
  no_log: true

- name: Create the directory the fencing key lives in
  ansible.builtin.file:
    path: "{{ fencing_key | dirname }}"
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['opensvc_cluster']

- name: Install the fencing key on the node
  ansible.builtin.copy:
    content: "{{ fencing_key_material.results[0].content | b64decode }}"
    dest: "{{ fencing_key }}"
    mode: "0400"
    owner: root
    group: root
  when: inventory_hostname in groups['opensvc_cluster']
  no_log: true
