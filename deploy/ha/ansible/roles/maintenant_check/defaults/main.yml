---
maintenant_check_script: /usr/local/sbin/maintenant-check
maintenant_check_url: "http://{{ ha_service_address }}:{{ maintenant_http_port | default(8080) }}/api/v1/health"

maintenant_check_timeout_seconds: 5

maintenant_start_script: /usr/local/sbin/maintenant-start
maintenant_stop_script: /usr/local/sbin/maintenant-stop
maintenant_start_timeout_seconds: 60
maintenant_start_term_wait_seconds: 5

# lab/lab reads the start, stop and check lines under this tag.
maintenant_check_log_identifier: maintenant-svc
