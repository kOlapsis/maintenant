---
# A wrong mount must fail the start, not quietly create a second, empty
# database beside the real one (FR-036).
- name: Refuse a deployment with the state root guard off
  ansible.builtin.assert:
    that: maintenant_require_state_dir | bool
    fail_msg: maintenant_require_state_dir must stay true in a highly available deployment.

# NORMAL loses acknowledged commits on a crash, which DRBD then replicates faithfully (FR-017).
- name: Refuse a replicated SQLite journal below FULL
  ansible.builtin.assert:
    that: maintenant_sqlite_synchronous | upper == 'FULL'
    fail_msg: "sqlite/drbd needs maintenant_sqlite_synchronous FULL, got {{ maintenant_sqlite_synchronous }}"
  when: ha_mode | default('ip-only') == 'sqlite/drbd'

- name: Refuse a deployment without a Pro licence key
  ansible.builtin.assert:
    that: maintenant_license_key | length > 0
    fail_msg: High availability needs the Pro edition; set MAINTENANT_LICENSE_KEY or maintenant_license_key.

- name: Refuse a build that could not verify the licence
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'LICENSE_PUBLIC_KEY') | length > 0
    fail_msg: >-
      LICENSE_PUBLIC_KEY is empty: the binary would run as Community and ignore the
      licence key. Export it first: export LICENSE_PUBLIC_KEY=$(gh variable get LICENSE_PUBLIC_KEY)

- name: Refuse a mode the highly available deployment does not run
  ansible.builtin.assert:
    that: maintenant_mode in ['embedded', 'server']
    fail_msg: "maintenant_mode must be embedded or server, got {{ maintenant_mode }}"

# The service moves between the nodes: an identity tied to one node would move with it (FR-038).
- name: Refuse an identity tied to the node in the service
  ansible.builtin.assert:
    that:
      - (maintenant_settings.MAINTENANT_EMBEDDED_AGENT | default('') | string | trim | lower) not in ['1', 't', 'true', 'y', 'yes', 'on']
      - "'MAINTENANT_RUNTIME' not in maintenant_settings"
    fail_msg: >-
      The service must not run the embedded agent nor a local runtime: each node is watched by
      an ordinary agent (maintenant_agent). Remove MAINTENANT_EMBEDDED_AGENT and MAINTENANT_RUNTIME.

- name: Refuse a gRPC URL that names a node instead of the service
  ansible.builtin.include_tasks: grpc_url.yml
  when: maintenant_mode == 'server'

- name: Refuse nodes whose clocks have drifted apart
  ansible.builtin.include_tasks: clock.yml

- name: Build the embedded web interface
  ansible.builtin.command:
    argv: [make, frontend]
    chdir: "{{ maintenant_source_dir }}"
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: true

- name: Read the source revision
  ansible.builtin.command:
    argv: [git, describe, --tags, --always, --dirty]
    chdir: "{{ maintenant_source_dir }}"
  register: maintenant_revision
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false

- name: Create the build directory
  ansible.builtin.file:
    path: "{{ maintenant_build_dir }}/gocache"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  become: false

# The nodes do not run the controller's libc: the binary is linked statically,
# exactly as the release builds it.
- name: Build the product binary
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ maintenant_source_dir | realpath }}:/src"
      - -w
      - /src
      - -v
      - "{{ maintenant_build_dir }}:/out"
      - -e
      - CGO_ENABLED=1
      - -e
      - GOFLAGS=-trimpath
      - -e
      - GOCACHE=/out/gocache/build
      - -e
      - GOMODCACHE=/out/gocache/mod
      - -e
      - "VERSION={{ maintenant_revision.stdout }}"
      - -e
      - LICENSE_PUBLIC_KEY
      - -e
      - "HOST_UID={{ lookup('ansible.builtin.pipe', 'id -u') }}"
      - -e
      - "HOST_GID={{ lookup('ansible.builtin.pipe', 'id -g') }}"
      - "{{ maintenant_build_image }}"
      - sh
      - -euc
      - |
        apk add --no-cache gcc musl-dev
        go build \
          -tags "netgo osusergo sqlite_omit_load_extension" \
          -ldflags "-s -w -linkmode external -extldflags -static -X main.version=${VERSION} -X main.publicKeyB64=${LICENSE_PUBLIC_KEY:-}" \
          -o /out/maintenant ./cmd/maintenant
        chown -R "${HOST_UID}:${HOST_GID}" /out/maintenant /out/gocache
  environment:
    LICENSE_PUBLIC_KEY: "{{ lookup('ansible.builtin.env', 'LICENSE_PUBLIC_KEY') }}"
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: true

- name: Read how the binary is linked
  ansible.builtin.command:
    argv: [file, "{{ maintenant_build_dir }}/maintenant"]
  register: maintenant_link
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  failed_when: "'statically linked' not in maintenant_link.stdout"

- name: Create the product account
  ansible.builtin.user:
    name: "{{ maintenant_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ maintenant_state_dir }}"
    create_home: false

- name: Read the groups of the product account
  ansible.builtin.command:
    argv: [id, -Gn, "{{ maintenant_user }}"]
  register: maintenant_user_groups
  changed_when: false

- name: Refuse a product account that reaches the container runtime of the node
  ansible.builtin.assert:
    that: "'docker' not in maintenant_user_groups.stdout.split()"
    fail_msg: >-
      {{ maintenant_user }} is in the docker group of {{ inventory_hostname }}: the service would
      report the containers of whichever node runs it. Remove it from the group.

- name: Install the product binary
  ansible.builtin.copy:
    src: "{{ maintenant_build_dir }}/maintenant"
    dest: "{{ maintenant_bin }}"
    mode: "0755"
    owner: root
    group: root
  register: maintenant_binary_install

# The binary binds the service address, which is not on this node while the
# service runs elsewhere. Without this, the start fails on the passive node the
# moment the address moves away.
- name: Allow binding an address this node does not hold
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Create the state root
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ maintenant_user }}"
    group: "{{ maintenant_user }}"
    mode: "0750"
  loop: "{{ [maintenant_state_dir] + ([maintenant_tls_dir] if maintenant_mode == 'server' else []) }}"

- name: Install the gRPC certificate and key
  ansible.builtin.include_tasks: tls.yml
  when: maintenant_mode == 'server'

# The state root is not replicated in this mode: each node would create its own identity.
- name: Install one telemetry identity on every node
  ansible.builtin.include_tasks: telemetry.yml
  when: ha_mode | default('ip-only') == 'postgres/streaming'

# The first start creates the data set; every later start must find it (FR-036, FR-043).
# Not in ip-only, where each node starts its own data set on its first failover.
- name: Read whether the service already requires an existing data set
  ansible.builtin.command:
    argv: [om, "{{ opensvc_service_name | default('maintenant') }}", config, get, --kw, "app#0.environment"]
  register: maintenant_live_environment
  changed_when: false
  failed_when: false
  no_log: true
  run_once: true

- name: Require the data set the service already created
  ansible.builtin.set_fact:
    maintenant_require_existing_data: "{{ 'MAINTENANT_REQUIRE_EXISTING_DATA=1' in maintenant_live_environment.stdout | default('') | split }}"
  when: ha_mode | default('ip-only') in maintenant_shared_data_modes
  run_once: true

- name: Write the settings
  ansible.builtin.template:
    src: maintenant.env.j2
    dest: "{{ maintenant_env_file }}"
    owner: root
    group: "{{ maintenant_user }}"
    mode: "0640"
  no_log: true
