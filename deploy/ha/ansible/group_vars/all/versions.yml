---
# Pinned versions for the HA bench and the reference production.
#
# FR-059: every version below is frozen. Changing any of them invalidates the
# evidence, so it MUST be followed by a full replay of the campaign
# (`lab run-all` on every implemented mode) and by a new run report. A version
# is never bumped "in passing".
#
# These values are read by the roles and copied verbatim into
# run.json.versions, so that two runs can be compared (see
# specs/030-ha-opensvc/contracts/run-report.md).

# OpenSVC om3. Pinned to a release-candidate tag: om3 has no GA, and 53 RCs
# were published in eight months. Never a branch, never "latest". If a GA is
# published before the freeze, it replaces this tag and the campaign is
# replayed.
#
# The bench runs the newest release the prod branch ships with a server
# package for bookworm, and stays on the prod branch: evidence built on a
# pre-validation channel is worth less than evidence built on the channel
# OpenSVC promotes. rc30 carried the campaign until 2026-10-18; rc53 replaces
# it on 2026-10-26 because the enroll and create --wait the deployment now
# relies on only exist from rc44 on.
# rc47 replaces rc53 on 2026-10-27: OpenSVC found a DRBD regression in rc53
# and asked to step back.
# rc62 replaces rc47 on 2026-11-11: the prod repository no longer carries
# anything older than rc55.
#
# apt is pinned to opensvc_package_version, so an upgrade cannot move the bench
# off this release without someone editing this file (FR-059).
opensvc_version: "v3.0.0-rc62"
opensvc_package_version: "3.0.0~rc62.0.ge29c763a7+deb12"
opensvc_apt_branch: "prod"

# DRBD 9, from the vendor packages. Protocol C, after-sb-* set to disconnect,
# no automatic resolution that throws writes away (FR-018, FR-023).
drbd_version: "9.2"
# LINBIT's public proxmox-8 suite, built on bookworm: the vendor publishes no
# DRBD 9 for Debian 12 elsewhere without a customer account.
drbd_dkms_package_version: "9.2.20-1"
drbd_utils_package_version: "9.35.0-1"

# PostgreSQL, from PGDG. 14 is the product floor; the bench pins one major and
# keeps it for the whole campaign.
postgres_version: "16"
# apt is pinned to this exact build, so the minor release cannot move under the
# campaign either.
postgres_package_version: "16.15-1.pgdg12+2"

# The kernel is a version too: it decides whether fanotify (fatrace) is
# available for the on-disk state inventory, and it is reported in
# run.json.versions. Pinned to the distribution kernel of the node image.
#
# Debian 12 and not 13: the prod branch publishes opensvc-server for bookworm
# and, as of 2026-09-12, only opensvc-client for trixie.
node_os: "debian-12"
node_codename: "bookworm"
