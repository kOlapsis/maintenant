---
# The bench deployment. site-prod.yml plays the same roles against another
# inventory (FR-052).

- name: Serve the arbitrator and the relay
  hosts: arbitrator
  roles:
    - opensvc_arbitrator
    - opensvc_relay

- name: Form the cluster
  hosts: opensvc_cluster
  roles:
    - opensvc
    - opensvc_relay
    - opensvc_arbitrator
    - fencing

# The arbitrator carries the third, diskless DRBD vote.
- name: Replicate the volume
  hosts: opensvc_cluster:arbitrator
  roles:
    - role: drbd
      when: ha_mode | default('ip-only') == 'sqlite/drbd'

# One play: the service template reads the defaults of the product roles.
- name: Install the product and declare the service
  hosts: opensvc_cluster
  roles:
    - maintenant
    - maintenant_check
    - role: postgres_ha
      when: ha_mode | default('ip-only') == 'postgres/streaming'
    - opensvc_service

- name: Run the witness container
  hosts: measurement
  roles:
    - lab_witness

- name: Enroll an agent on every machine that is not the arbitrator
  hosts: opensvc_cluster:measurement
  roles:
    - maintenant_agent

- name: Start the probes
  hosts: measurement
  roles:
    - probes
