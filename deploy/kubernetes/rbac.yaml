# Apply with:
#   kubectl create namespace maintenant
#   kubectl apply -f deploy/kubernetes/
# The namespace is fixed here, in the ClusterRoleBinding subject and in
# deployment.yaml; change all of them together.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maintenant
  namespace: maintenant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: maintenant
rules:
  # Read-only, exactly the APIs the runtime calls (internal/kubernetes/rbac.go).
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # Requires metrics-server.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: maintenant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: maintenant
subjects:
  - kind: ServiceAccount
    name: maintenant
    namespace: maintenant
