# Apply with: kubectl apply -n <your-namespace> -f deployment.yaml
# No namespace is hardcoded — kubectl -n sets it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenant
  labels:
    app.kubernetes.io/name: maintenant
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite single-writer
  selector:
    matchLabels:
      app.kubernetes.io/name: maintenant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maintenant
        app.kubernetes.io/component: monitoring
    spec:
      serviceAccountName: maintenant
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: maintenant
          image: ghcr.io/kolapsis/maintenant:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MAINTENANT_ADDR
              value: "0.0.0.0:8080"
            - name: MAINTENANT_RUNTIME
              value: "kubernetes"
            - name: MAINTENANT_DB
              value: "/data/maintenant.db"
            # Optional: back the server data set with a PostgreSQL you already
            # operate, so a replacement pod picks the fleet back up instead of
            # needing every host re-enrolled. Unset means SQLite on the volume
            # above, which is the default and needs nothing here.
            # The /data volume must still follow the instance: it carries the
            # licence cache and the update window record.
            # - name: MAINTENANT_DATABASE_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: maintenant-database
            #       key: url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          # Schema migrations run before the HTTP listener starts, so /health stays
          # silent for their whole duration — minutes on a large database, and the
          # one-time UUID conversion is slower still. Without a startupProbe the
          # liveness probe below kills the pod ~95s in, leaving the migration
          # half-applied and marked dirty, and it repeats on every restart.
          # 60 x 10s = 10 minutes of grace; liveness only takes over after that.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maintenant-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maintenant-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Table rebuilds during migration copy a table before dropping the old one,
      # and SQLite temp files land on this volume too (SQLITE_TMPDIR=/data), so
      # headroom of several times the database size is needed to upgrade at all.
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: maintenant
  labels:
    app.kubernetes.io/name: maintenant
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: maintenant
